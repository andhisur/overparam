[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "andhisur-overparam"
version = "0.1.0"
description = "从输入中抽取数值，计算工具调用的越权参数相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "andhisur" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://andhisur.github.io"
Repository = "https://github.com/andhisur/overparam"
Issues = "https://github.com/andhisur/overparam/issues"

[project.scripts]
overparam = "overparam:main"

[tool.setuptools]
py-modules = ["overparam"]
